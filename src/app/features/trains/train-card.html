<a class="train-card card" [routerLink]="['/trains', train().trainId]">
  <img
    class="train-image"
    [src]="details()?.thumbnail || '/train-placeholder.svg'"
    [alt]="train().trainName + ' train'"
    loading="lazy"
    (error)="useFallbackImage($event)"
  />
  <div class="card-body">
    <div class="train-meta">
      <span class="train-number">#{{ train().trainNumber }}</span>
      @if (details()) {
        <span class="coach-count">{{ details()!.coachesCount }} coaches</span>
      }
    </div>
    <h3>{{ train().trainName }}</h3>
    <p class="route">{{ train().origin }} <span aria-hidden="true">→</span> {{ train().destination }}</p>
    @if (details()) {
      <p class="seat-info">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 11V7a2 2 0 0 1 4 0v4m-5 0h16a2 2 0 0 1 2 2v5H2v-5a2 2 0 0 1 2-2Zm-2 7v2m20-2v2" />
        </svg>
        {{ details()!.totalSeats }} seats
      </p>
    }
  </div>
</a>
